<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pulse">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0b0e">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-icon">
<title>Pulse</title>
<link rel="stylesheet" href="style.css?v=6">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <pattern id="p-rem" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" style="fill:var(--rem)"/><rect width="3" height="6" style="fill:var(--card)" opacity=".55"/></pattern>
  <pattern id="p-low" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" style="fill:var(--rec-lo)"/><rect width="3" height="6" style="fill:var(--card)" opacity=".55"/></pattern>
  <pattern id="p-awake" width="5" height="5" patternUnits="userSpaceOnUse"><rect width="5" height="5" style="fill:var(--awake)" opacity=".3"/><circle cx="2.5" cy="2.5" r="1.5" style="fill:var(--awake)"/></pattern>
</defs></svg>
<div class="shell">
  <nav id="nav" aria-label="Sections"></nav>
  <div class="content">
    <header class="top">
      <div>
        <div class="eyebrow" id="date"></div>
        <h1 id="title">Today</h1>
      </div>
      <div class="top-actions">
        <span id="badge" class="badge"></span>
        <button id="refresh" class="icon-btn" aria-label="Refresh data" title="Refresh"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.5-5.8M20 4v5h-5"/></svg></button>
        <button id="gear" class="icon-btn" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
      </div>
    </header>
    <div id="datebar" class="datebar hidden"></div>
    <div id="banner" class="banner hidden"></div>
    <main id="view" aria-live="polite"></main>
    <p class="foot">Wellness estimates for personal use, not medical advice. Your data stays in your own database.</p>
  </div>
</div>
<div id="tip" class="tip hidden" role="tooltip"></div>
<dialog id="settings">
  <form method="dialog" class="sheet-head"><h2>Settings</h2><button class="icon-btn" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></form>
  <div class="sheet-body" id="settings-body"></div>
</dialog>
<dialog id="explain">
  <form method="dialog" class="sheet-head"><h2 id="explain-title"></h2><button class="icon-btn" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></form>
  <div class="sheet-body" id="explain-body"></div>
</dialog>
<script src="charts.js?v=6"></script>
<script src="explain.js?v=6"></script>
<script src="app.js?v=6"></script>
</body>
</html>
